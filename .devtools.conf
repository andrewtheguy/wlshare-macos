# Per-repo values for the shared ../devtools scripts (see
# ../devtools/templates/devtools.conf.sample for every key).
REPO_NAME=wlshare-macos
APP_NAME=wlshare
PROJECT_NAME=WlshareViewer
SCHEME=WlshareViewer
PRODUCT_NAME=WlshareViewer

# The sibling that holds the session this repo's core is built on
# (`crates/wlshare-client`, with `crates/wlshare-rfb` under it). The dependency
# is a pinned tag that cargo fetches on the Mac by itself, so this is not what
# makes a build work there: mac-ci.sh requires the key, having the checkout
# over is what a `--config` patch against an unreleased wlshare-client needs,
# and `ci/ci.sh live` runs wlshare-client's live tests from it.
CORE_REPO=wlshare
CORE_GH_REPO=andrewtheguy/wlshare

# Nothing here signs, so the whole default set runs over plain ssh.
MAC_CI_DEFAULT_JOBS="core app"
