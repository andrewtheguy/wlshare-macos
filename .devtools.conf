# Per-repo values for the shared ../devtools scripts (see
# ../devtools/templates/devtools.conf.sample for every key).
REPO_NAME=wlshare-macos
APP_NAME=wlshare
PROJECT_NAME=WlshareViewer
SCHEME=WlshareViewer
PRODUCT_NAME=WlshareViewer

# The sibling that holds the shared Rust library this repo's core links against
# (`crates/wlshare-rfb`). mac-ci.sh rsyncs it alongside this tree, which is what
# keeps core/Cargo.toml's `../../wlshare` path dependency resolvable on the Mac.
CORE_REPO=wlshare
CORE_GH_REPO=andrewtheguy/wlshare

# Nothing here signs, so the whole default set runs over plain ssh.
MAC_CI_DEFAULT_JOBS="core app"
