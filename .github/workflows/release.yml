name: Release the macOS app

# Builds the app exactly as scripts/package-mac.sh builds it on a Mac, wraps it
# in a drag-to-Applications disk image and publishes that as the GitHub release
# v<version>, where the version is the app bundle's CFBundleShortVersionString —
# project.yml's MARKETING_VERSION. Run it by hand; bump the version first. A run
# on any branch other than main is marked a prerelease.
#
# Nothing here is signed with a Developer ID or notarized: there is no
# certificate in this repo's secrets, and the README tells people how to open an
# unsigned download.
on:
  workflow_dispatch:

permissions:
  contents: write

# One release at a time. Two runs would race over the same draft, the same
# version check and the same tag; queued rather than cancelled, because a run
# that is already uploading a disk image has nothing to gain from being killed.
concurrency:
  group: release-the-macos-app
  cancel-in-progress: false

jobs:
  release:
    # One job on one Mac: the core, the app, the disk image and the release are
    # a single chain, and there is one artifact at the end of it.
    runs-on: macos-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Ensure the Metal toolchain
        # Xcode 16.3 made it a component that is downloaded rather than shipped,
        # and Desktop.metal does not compile without it.
        run: xcrun -f metal >/dev/null 2>&1 || xcodebuild -downloadComponent MetalToolchain

      - name: Package the app
        # Writes dist/package/: the disk image, SHA256SUMS and VERSION.
        run: scripts/package-mac.sh

      - name: Determine and validate the version
        id: version
        # After the build rather than before it: the version comes from the
        # bundle that was just built, so a tag that already exists costs one
        # wasted build — and a tag is still only created when the release is
        # published, at the end.
        run: |
          set -euo pipefail
          VERSION=$(cat dist/package/VERSION)
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+(\.[0-9]+){1,2}$'; then
            echo "::error::invalid CFBundleShortVersionString: ${VERSION}"
            exit 1
          fi
          TAG="v${VERSION}"
          echo "Release tag: ${TAG}"
          IS_PRERELEASE="false"
          [ "$GITHUB_REF_NAME" = "main" ] || IS_PRERELEASE="true"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=${IS_PRERELEASE}" >> "$GITHUB_OUTPUT"

      - name: Abort if the tag already exists
        run: |
          if git ls-remote --tags origin "refs/tags/${{ steps.version.outputs.tag }}" | grep -q .; then
            echo "::error::Tag ${{ steps.version.outputs.tag }} already exists on remote. Bump MARKETING_VERSION in project.yml first."
            exit 1
          fi

      - name: Create the draft release
        run: |
          # A draft does not create the tag, so a draft left behind by a failed
          # run is the one thing that can collide here; real tags are caught
          # above.
          if gh release view "${{ steps.version.outputs.tag }}" --json isDraft --jq '.isDraft' 2>/dev/null | grep -qx true; then
            echo "Deleting stale draft release ${{ steps.version.outputs.tag }}"
            gh release delete "${{ steps.version.outputs.tag }}" --yes
          fi
          gh release create "${{ steps.version.outputs.tag }}" \
            --draft \
            --target "${{ github.sha }}" \
            --title "${{ steps.version.outputs.tag }}" \
            --generate-notes \
            ${{ steps.version.outputs.is_prerelease == 'true' && '--prerelease' || '' }}

      - name: Upload the disk image to the draft release
        run: gh release upload "${{ steps.version.outputs.tag }}" dist/package/*.dmg dist/package/SHA256SUMS

      - name: Publish the release (removes the draft, creates the tag)
        run: gh release edit "${{ steps.version.outputs.tag }}" --draft=false
