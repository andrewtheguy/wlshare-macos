[package]
name = "wlshare-client-core"
version = "0.0.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/andrewtheguy/wlshare-macos"
description = "The wlshare client's macOS half — its key and wheel tables and the C ABI — under the macOS app"

# `staticlib` is what the app target links; `rlib` is what the tests and any
# other Rust consumer build against. `cdylib` is deliberately absent: the app
# ships one binary and has nothing to load a dylib out of.
[lib]
name = "wlshare_client_core"
crate-type = ["staticlib", "rlib"]

[dependencies]
# The session, and every protocol byte under it, from the release this client
# was built and tested against — not the sibling checkout, so what is built here
# is the same on this machine, on the Mac and on one that has never heard of
# `../wlshare`. Cargo.lock holds the revision the tag stood for. The Windows app
# is built on the same crate. `wlshare_rfb` comes re-exported with it, so there
# is one tag to move and no second one to fall out of step.
#
# To build against an unreleased change, point it at the checkout for as long
# as that takes, without committing anything:
#
#   cargo test --config 'patch."https://github.com/andrewtheguy/wlshare.git".wlshare-client.path="../../wlshare/crates/wlshare-client"'
#
# That rewrites Cargo.lock while it is in force, so put the pinned one back
# (`git checkout core/Cargo.lock`) before committing anything.
wlshare-client = { git = "https://github.com/andrewtheguy/wlshare.git", tag = "v0.0.34" }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
panic = "abort"
