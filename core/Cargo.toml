[package]
name = "wlshare-client-core"
version = "0.0.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/andrewtheguy/wlshare-macos"
description = "The wlshare client's session, framebuffer and C ABI, under the macOS app"

# `staticlib` is what the app target links; `rlib` is what the tests and any
# other Rust consumer build against. `cdylib` is deliberately absent: the app
# ships one binary and has nothing to load a dylib out of.
[lib]
name = "wlshare_client_core"
crate-type = ["staticlib", "rlib"]

[dependencies]
# Every protocol byte. The sibling checkout, not a release: the two move
# together and there is nothing published to pin.
wlshare-rfb = { path = "../../wlshare/crates/wlshare-rfb" }
anyhow = "1"
thiserror = "2"
log = "0.4"
tokio = { version = "1", default-features = false, features = ["rt", "net", "io-util", "sync", "time", "macros"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "net", "time"] }
# The live tests talk to a real server; `RUST_LOG=debug` is how one says what it
# sent when it did not send what was expected.
env_logger = "0.11"

[profile.release]
lto = "thin"
codegen-units = 1
debug = 1
